# One server per app, chosen by the hostname Cloudflare Tunnel forwards.
map $host $app_root {
  default                            /srv/marketing;
  rentify.mekhla.digital             /srv/marketing;
  rentify-auth.mekhla.digital        /srv/auth;
  rentify-seller.mekhla.digital      /srv/merchant;
  rentify-market.mekhla.digital      /srv/marketplace;
  rentify-admin.mekhla.digital       /srv/admin;
}

server {
  listen 80 default_server;
  server_name _;
  root $app_root;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Runtime address files (Angular apps) change per deployment; first match wins.
  location ~* -config\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  # Fingerprinted build files never change; everything else is revalidated.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Single-page apps: unknown paths load the app, which routes them.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
