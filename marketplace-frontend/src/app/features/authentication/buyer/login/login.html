<app-auth-layout
  variant="signin"
  [eyebrow]="content().eyebrow"
  [title]="content().title"
  [subtitle]="content().subtitle"
>
  @if (sellerIntent()) {
    <div class="notice info" role="status">
      Selling on KhmerCraft starts with a KhmerCraft account. Sign in — or
      create one below — and we'll take you straight to setting up your store.
    </div>
  }
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <!-- Single unified login page: tabs removed -->

  <form class="auth-form" [class.submitted]="submitted()" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ content().emailLabel }}<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="mail" [size]="16"></ui-icon>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="content().emailPlaceholder"
        />
      </span>
      @if (submitted() && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>

    <label>
      <span>Password <span class="required">*</span></span>
      <div class="password-field">
        <span class="input-icon-wrap">
          <ui-icon name="lock" [size]="16"></ui-icon>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            [attr.title]="passwordVisible() ? 'Hide password' : 'Show password'"
          >
            <ui-icon [name]="passwordVisible() ? 'eye' : 'eye-off'" [size]="18" />
          </button>
        </span>
      </div>
      @if (submitted() && form.controls.password.invalid) {
        <small>Password is required.</small>
      }
      <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>
    </label>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? content().busy : content().button }}
    </button>
  </form>

  <p class="auth-switch">
    New to KhmerCraft? <a routerLink="/register">Create a buyer account</a>
  </p>
</app-auth-layout>
