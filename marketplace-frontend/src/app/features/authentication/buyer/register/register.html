<app-auth-layout
  variant="create"
  title="Create your account"
  subtitle="Join a marketplace built around meaningful objects and the people who make them."
>
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form compact" [class.submitted]="submitted()" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="name-row">
      <label>
        <span>First name<span class="required">*</span></span>
        <span class="input-icon-wrap">
          <ui-icon name="user" [size]="16"></ui-icon>
          <input formControlName="firstName" autocomplete="given-name" placeholder="Sophea" />
        </span>
        @if (submitted() && form.controls.firstName.invalid) {
          <small>Enter at least 2 characters.</small>
        }
      </label>

      <label>
        <span>Last name<span class="required">*</span></span>
        <span class="input-icon-wrap">
          <ui-icon name="user" [size]="16"></ui-icon>
          <input formControlName="lastName" autocomplete="family-name" placeholder="Chan" />
        </span>
        @if (submitted() && form.controls.lastName.invalid) {
          <small>Enter at least 2 characters.</small>
        }
      </label>
    </div>

    <label>
      <span>Email address<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="mail" [size]="16"></ui-icon>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      </span>
      @if (submitted() && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
      <small class="hint">We'll email a 6-digit code to confirm it's really you.</small>
    </label>

    <label>
      <span>Phone <em>Optional</em></span>
      <span class="input-icon-wrap">
        <ui-icon name="phone" [size]="16"></ui-icon>
        <input type="tel" formControlName="phone" autocomplete="tel" placeholder="+855 12 345 678" />
      </span>
    </label>

    <div class="password-row" [formGroup]="passwords">
      <label>
        <span>Password<span class="required">*</span></span>
        <div class="password-field">
          <span class="input-icon-wrap">
            <ui-icon name="lock" [size]="16"></ui-icon>
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Create a password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
              [attr.title]="passwordVisible() ? 'Hide password' : 'Show password'"
            >
              <ui-icon [name]="passwordVisible() ? 'eye' : 'eye-off'" [size]="18" />
            </button>
          </span>
        </div>
        @if (submitted() && passwords.controls.password.invalid) {
          <small>8+ characters, upper &amp; lowercase, a number.</small>
        }
      </label>

      <label>
        <span>Confirm password<span class="required">*</span></span>
        <div class="password-field">
          <span class="input-icon-wrap">
            <ui-icon name="lock" [size]="16"></ui-icon>
            <input
              [type]="confirmVisible() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter your password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="toggleConfirm()"
              [attr.aria-label]="confirmVisible() ? 'Hide password' : 'Show password'"
              [attr.title]="confirmVisible() ? 'Hide password' : 'Show password'"
            >
              <ui-icon [name]="confirmVisible() ? 'eye' : 'eye-off'" [size]="18" />
            </button>
          </span>
        </div>
        @if (submitted() && passwords.errors?.['passwordMismatch']) {
          <small>Passwords don't match.</small>
        }
      </label>
    </div>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Sending code…' : 'Create buyer account' }}
    </button>
  </form>

  <p class="auth-switch">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</app-auth-layout>
