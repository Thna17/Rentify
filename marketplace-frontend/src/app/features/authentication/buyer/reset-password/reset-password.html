<app-auth-layout
  variant="recover"
  eyebrow="Account recovery"
  title="Choose a new password"
  subtitle="Create a strong password you haven't used for this account before."
>
  @if (!token) {
    <div class="notice error" role="alert">
      This reset link is incomplete. Request a new link to continue.
    </div>
    <p class="auth-switch"><a routerLink="/forgot-password">Request a new link</a></p>
  } @else if (complete()) {
    <div class="notice success" role="status">
      Your password has been reset. You can now sign in with the new password.
    </div>
    <a class="primary-button button-link" routerLink="/login">Continue to sign in</a>
  } @else {
    @if (error()) {
      <div class="notice error" role="alert">{{ error() }}</div>
    }
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>New password<span class="required">*</span></span>
        <div class="password-field">
          <span class="input-icon-wrap">
            <ui-icon name="lock" [size]="16"></ui-icon>
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Enter a new password"
            />
          </span>
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            [attr.title]="passwordVisible() ? 'Hide password' : 'Show password'"
          >
            <ui-icon [name]="passwordVisible() ? 'eye' : 'eye-off'" [size]="18" />
          </button>
        </div>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small>Use 8+ characters with uppercase, lowercase and a number.</small>
        }
      </label>
      <label>
        <span>Confirm password<span class="required">*</span></span>
        <div class="password-field">
          <span class="input-icon-wrap">
            <ui-icon name="lock" [size]="16"></ui-icon>
            <input
              [type]="confirmPasswordVisible() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Repeat your new password"
            />
          </span>
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
            [attr.aria-label]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
            [attr.title]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
          >
            <ui-icon [name]="confirmPasswordVisible() ? 'eye' : 'eye-off'" [size]="18" />
          </button>
        </div>
      </label>
      <button class="primary-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Updating…' : 'Reset password' }}
      </button>
    </form>
  }
</app-auth-layout>
