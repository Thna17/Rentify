<app-auth-layout
  variant="recover"
  eyebrow="Account recovery"
  title="Reset your password"
  subtitle="Enter the email on your account and we'll send a secure, single-use link."
>
  @if (sent()) {
    <div class="notice success" role="status">
      If an account exists for that email, a reset link is on its way. It expires shortly, so use it soon.
    </div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email address</span>
      <span class="input-icon-wrap">
        <ui-icon name="mail" [size]="16"></ui-icon>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      </span>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>
    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Sending…' : 'Send reset link' }}
    </button>
  </form>
  <p class="auth-switch"><a routerLink="/login">← Back to sign in</a></p>
</app-auth-layout>
