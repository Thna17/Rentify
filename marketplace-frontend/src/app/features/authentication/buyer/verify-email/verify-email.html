<app-auth-layout
  variant="verify"
  eyebrow="Email verification"
  title="Check your email"
  [subtitle]="'Enter the 6-digit code we sent to ' + (email() || 'your email') + ' to finish creating your account.'"
>
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }
  @if (resendMessage()) {
    <div class="notice success" role="status">{{ resendMessage() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Verification code<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="key" [size]="16"></ui-icon>
        <input
          formControlName="code"
          placeholder="000000"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
        />
      </span>
      @if (form.controls.code.touched && form.controls.code.invalid) {
        <small>Enter the 6-digit code from your email.</small>
      }
    </label>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Verifying…' : 'Verify and continue' }}
    </button>
  </form>

  <p class="resend-row">
    Didn't get a code?
    <button type="button" (click)="resend()" [disabled]="resending()">
      {{ resending() ? 'Sending…' : 'Resend code' }}
    </button>
  </p>

  <p class="auth-switch"><a routerLink="/register" queryParamsHandling="preserve">← Back to sign up</a> · <a routerLink="/login" queryParamsHandling="preserve">Sign in</a></p>
</app-auth-layout>
