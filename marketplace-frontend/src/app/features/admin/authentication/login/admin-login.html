<!-- Admin feature: authentication entry point. -->
<app-auth-layout
  eyebrow="Restricted access"
  title="Admin sign in"
  subtitle="Use your authorized KhmerCraft administrator credentials."
  variant="admin"
>
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Admin email</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="admin@khmercraft.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>
    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="Enter your password" />
    </label>
    <button class="primary-button admin-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Verifying…' : 'Access admin portal' }}
    </button>
  </form>
  <p class="auth-switch"><a routerLink="/login">← Return to buyer sign in</a></p>
</app-auth-layout>
