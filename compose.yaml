name: rentify

x-core-environment: &core-environment
  NODE_ENV: development
  PORT: 3001
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: rentify_core
  DB_USER: rentify
  DB_PASSWORD: ${MYSQL_APP_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  COOKIE_SECRET: ${COOKIE_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  RENTIFY_API_URL: http://localhost:3001
  ECOMMERCE_API_URL: http://ecommerce-api:4001
  AUTH_URL: http://localhost:4300
  MERCHANT_DASHBOARD_URL: http://localhost:4400
  MARKETING_URL: http://localhost:4200
  MARKETPLACE_URL: http://localhost:4201
  STOREFRONT_ORIGIN: http://localhost:4700
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4300,http://localhost:4400,http://localhost:4700,http://localhost:4600
  AUTH_RETURN_URL_ALLOWLIST: http://localhost:4200,http://localhost:4201,http://localhost:4300,http://localhost:4400,http://localhost:4700,http://localhost:4600
  SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN}

x-commerce-environment: &commerce-environment
  NODE_ENV: development
  PORT: 4001
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: rentify_ecommerce
  DB_USER: rentify
  DB_PASSWORD: ${MYSQL_APP_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  COOKIE_SECRET: ${COOKIE_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  RENTIFY_API_URL: http://core-api:3001
  ECOMMERCE_API_URL: http://localhost:4001
  AUTH_URL: http://localhost:4300
  MERCHANT_DASHBOARD_URL: http://localhost:4400
  MARKETING_URL: http://localhost:4200
  MARKETPLACE_URL: http://localhost:4201
  STOREFRONT_ORIGIN: http://localhost:4700
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4300,http://localhost:4400,http://localhost:4700,http://localhost:4600
  SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN}
  PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY}
  MARKETPLACE_COD_CHECKOUT_ENABLED: 'false'

x-frontend-environment: &frontend-environment
  VITE_RENTIFY_API_URL: http://localhost:3001
  VITE_ECOMMERCE_API_URL: http://localhost:4001
  VITE_AUTH_URL: http://localhost:4300
  VITE_MERCHANT_DASHBOARD_URL: http://localhost:4400
  VITE_MARKETING_URL: http://localhost:4200
  VITE_MARKETPLACE_URL: http://localhost:4201
  VITE_STOREFRONT_ORIGIN: http://localhost:4700

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: rentify
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: rentify_core
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-create-commerce-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  core-migrate:
    build:
      context: ./rentify-server
      target: development
    command: sh -c "npm run db:migrate && npm run db:seed"
    environment: *core-environment
    volumes:
      - ./rentify-server/src:/app/src
      - ./rentify-server/test:/app/test
      - ./rentify-server/scripts:/app/scripts
      - ./rentify-server/package.json:/app/package.json
    depends_on:
      mysql:
        condition: service_healthy

  commerce-migrate:
    build:
      context: ./ecommerce-server
      target: development
    command: sh -c "npm run db:migrate && npm run db:seed"
    environment: *commerce-environment
    volumes:
      - ./ecommerce-server:/app
      - commerce-node-modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  core-api:
    build:
      context: ./rentify-server
      target: development
    command: npm run dev
    environment: *core-environment
    ports:
      - '3001:3001'
    volumes:
      - ./rentify-server/src:/app/src
      - ./rentify-server/test:/app/test
      - ./rentify-server/scripts:/app/scripts
      - ./rentify-server/package.json:/app/package.json
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
      ecommerce-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3001/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  ecommerce-api:
    build:
      context: ./ecommerce-server
      target: development
    command: npm run dev
    environment: *commerce-environment
    ports:
      - '4001:4001'
    volumes:
      - ./ecommerce-server:/app
      - commerce-node-modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      commerce-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4001/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  marketing:
    build:
      context: ./rentify-frontend
      target: development
    command: npm run dev:marketing -- --host 0.0.0.0
    environment: *frontend-environment
    ports:
      - '4200:4200'
    volumes:
      - ./rentify-frontend:/app
      - marketing-node-modules:/app/node_modules
    depends_on:
      core-api:
        condition: service_healthy

  auth:
    build:
      context: ./rentify-frontend
      target: development
    command: npm run dev:auth -- --host 0.0.0.0
    environment: *frontend-environment
    ports:
      - '4300:4300'
    volumes:
      - ./rentify-frontend:/app
      - auth-node-modules:/app/node_modules
    depends_on:
      core-api:
        condition: service_healthy

  merchant:
    build:
      context: ./rentify-frontend
      target: development
    command: npm run dev:merchant -- --host 0.0.0.0
    environment: *frontend-environment
    ports:
      - '4400:4400'
    volumes:
      - ./rentify-frontend:/app
      - merchant-node-modules:/app/node_modules
    depends_on:
      core-api:
        condition: service_healthy
      ecommerce-api:
        condition: service_healthy

  storefront-template-1:
    build:
      context: ./rentify-frontend
      target: development
    command: npm run dev:ecommerce-template-1 -- --host 0.0.0.0
    environment: *frontend-environment
    ports:
      - '4700:4700'
    volumes:
      - ./rentify-frontend:/app
      - template-1-node-modules:/app/node_modules
    depends_on:
      ecommerce-api:
        condition: service_healthy

  storefront-template-2:
    build:
      context: ./rentify-frontend
      target: development
    command: npm run dev:ecommerce-template-2 -- --host 0.0.0.0
    environment: *frontend-environment
    ports:
      - '4600:4600'
    volumes:
      - ./rentify-frontend:/app
      - template-2-node-modules:/app/node_modules
    depends_on:
      ecommerce-api:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  commerce-node-modules:
  marketing-node-modules:
  auth-node-modules:
  merchant-node-modules:
  template-1-node-modules:
  template-2-node-modules:
