<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rentify UX Redesign</title>
<!--
  Grayscale wireframe: Rentify UX redesign for the merchant dashboard, the buyer marketplace and the POS app.
  Mobile first; the top bar switches to Desktop (merchant, marketplace) or Tablet (POS).
  Audit: docs/audits/2026-10-31-merchant-dashboard-ux-audit.md. Target IA: docs/experience 03 §4, 06.
  Real content comes from the local seed data (Mekong Brew, Emily Watson); gray bars are placeholders.
  "Needs backend" chips mark parts that need API work before they can be built.
  Check: node ~/.claude/skills/ui-ux-design/scripts/check_wireframes.js docs/experience/wireframes/rentify-ux-redesign.html
-->
<style>
  :root { --bg:#fff; --ink:#111; --ink-2:#555; --ink-3:#6b6b6b; --line:#e3e3e3; --fill:#f3f3f3; --fill-2:#e9e9e9; --r:8px; }
  * { box-sizing:border-box; }
  body { margin:0; background:#d9d9d9; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  a { color:inherit; text-decoration:none; }
  .proto-bar { position:sticky; top:0; z-index:50; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 16px; background:#222; color:#ddd; font-size:12px; }
  .proto-bar strong { color:#fff; margin-right:8px; }
  .proto-bar select, .proto-bar button { background:#333; color:#eee; border:1px solid #555; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; }
  .proto-bar button[aria-pressed="true"] { background:#eee; color:#111; }
  .stage { padding:24px 16px 64px; display:flex; justify-content:center; }
  .device { position:relative; background:var(--bg); width:100%; max-width:1280px; min-height:760px; border-radius:6px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .device.mobile { max-width:390px; }
  .top { min-height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 12px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; min-width:0; }
  .brand small { font-weight:500; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mark { width:22px; height:22px; border-radius:50%; border:2.5px solid var(--ink); flex:none; }
  .search { flex:1; max-width:440px; margin:0 auto; height:38px; border-radius:999px; background:var(--fill); display:flex; align-items:center; padding:0 14px; color:var(--ink-3); white-space:nowrap; overflow:hidden; }
  .spacer { flex:1; }
  .icon-btn { width:40px; height:40px; border-radius:999px; display:grid; place-items:center; color:var(--ink-2); flex:none; position:relative; }
  .icon-btn .badge { position:absolute; top:4px; right:2px; min-width:16px; height:16px; border-radius:8px; background:var(--ink); color:#fff; font-size:10px; display:grid; place-items:center; padding:0 3px; }
  .ico { width:18px; height:18px; border:1.8px solid currentColor; border-radius:5px; display:inline-block; flex:none; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--fill-2); display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--ink-2); flex:none; }
  .btn { min-height:40px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; font-size:13px; }
  .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn.block { display:flex; width:100%; min-height:48px; }
  .btn.ghost { border-color:transparent; color:var(--ink-2); }
  .btn.sm { min-height:34px; padding:0 10px; font-size:12px; }
  .body { flex:1; display:flex; min-height:0; }
  .side { width:236px; flex:none; border-right:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:2px; }
  .side h6, .drawer h6 { margin:14px 12px 4px; font-size:12px; font-weight:600; color:var(--ink-3); }
  .nav-item { display:flex; align-items:center; gap:12px; min-height:40px; padding:0 12px; border-radius:var(--r); color:var(--ink-2); font-weight:500; }
  .nav-item.on { color:var(--ink); font-weight:700; background:var(--fill); }
  .nav-item .tag { margin-left:auto; font-size:11px; border:1px solid var(--line); border-radius:999px; padding:0 6px; color:var(--ink-3); }
  .main { flex:1; min-width:0; display:flex; justify-content:center; overflow:auto; }
  .col { width:100%; max-width:760px; padding:0 0 32px; }
  .col.wide { max-width:1100px; }
  .rail { width:320px; flex:none; padding:20px; border-left:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  .page-head { padding:16px 16px 8px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .page-head h1 { margin:0; font-size:22px; line-height:1.25; }
  .page-head p { margin:4px 0 0; color:var(--ink-2); font-size:13px; width:100%; }
  .page-head .acts { margin-left:auto; display:flex; gap:8px; }
  .back { font-size:13px; color:var(--ink-2); padding:12px 16px 0; display:block; }
  .eyebrow { font-size:12px; color:var(--ink-3); font-weight:600; }
  .sec { padding:8px 16px 16px; }
  .sec h3 { margin:6px 0 10px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; }
  .sec h3 a { font-size:13px; font-weight:600; color:var(--ink-2); }
  .card { border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--bg); } .card h4 { margin:0 0 6px; }
  .meta { color:var(--ink-3); font-size:13px; }
  .ph { display:inline-block; width:100%; height:10px; border-radius:4px; background:var(--fill-2); margin:4px 0; vertical-align:middle; } .ph.t { height:14px; width:70%; background:#d6d6d6; } .ph.s { width:45%; } .ph.xs { width:56px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .device.mobile .grid3, .device.mobile .grid4 { grid-template-columns:1fr 1fr; }
  .tile { border:1px solid var(--line); border-radius:14px; padding:12px; min-height:84px; display:flex; flex-direction:column; gap:2px; }
  .tile b { font-size:20px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 8px; scrollbar-width:none; }
  .chip { flex:none; min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); background:var(--bg); white-space:nowrap; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; }
  .pill { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:12px; color:var(--ink-2); white-space:nowrap; }
  .pill.strong { border-color:var(--ink); color:var(--ink); font-weight:700; }
  .pill.dash { border-style:dashed; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); padding:0 12px; overflow-x:auto; scrollbar-width:none; }
  .tab { padding:12px 10px; color:var(--ink-2); border-bottom:2px solid transparent; white-space:nowrap; font-size:13px; } .tab.on { color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .row { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); min-height:60px; }
  .row .grow { flex:1; min-width:0; }
  .row .t { font-weight:600; }
  .row .end { margin-left:auto; text-align:right; flex:none; }
  .thumb { width:48px; height:48px; border-radius:10px; background:var(--fill-2); flex:none; }
  .thumb.lg { width:100%; height:auto; aspect-ratio:1/1; border-radius:14px; }
  .thumb.sq { width:100%; aspect-ratio:1/1; height:auto; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-weight:600; font-size:13px; }
  .field .input { min-height:46px; border:1px solid var(--line); border-radius:10px; padding:0 12px; display:flex; align-items:center; color:var(--ink-3); background:var(--bg); }
  .field .input.area { min-height:88px; align-items:flex-start; padding-top:10px; }
  .field .hint { font-size:12px; color:var(--ink-3); }
  .form { display:flex; flex-direction:column; gap:14px; padding:12px 16px; }
  .steps { display:flex; flex-direction:column; }
  .stepi { display:flex; gap:12px; padding:8px 0; }
  .stepi .dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-3); margin-top:3px; flex:none; }
  .stepi.done .dot { background:var(--ink); border-color:var(--ink); }
  .stepi.now .dot { border-color:var(--ink); box-shadow:0 0 0 3px var(--fill-2); }
  .sticky-bar { position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:8px; align-items:center; }
  .need { display:inline-flex; gap:6px; align-items:center; border:1.5px dashed #9a9a9a; border-radius:8px; padding:4px 8px; font-size:12px; color:var(--ink-2); background:#fafafa; }
  .note-box { border-left:3px solid var(--ink); background:var(--fill); padding:8px 12px; font-size:13px; border-radius:0 8px 8px 0; }
  .banner { margin:10px 16px 0; border:1px dashed #9a9a9a; border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:center; background:var(--fill); font-size:13px; }
  .banner .btn { margin-left:auto; }
  .empty { text-align:center; padding:40px 24px; color:var(--ink-2); } .empty h2 { color:var(--ink); margin:12px 0 6px; font-size:18px; }
  .empty .art { width:72px; height:72px; border-radius:18px; background:var(--fill-2); margin:0 auto; }
  .skel { background:linear-gradient(90deg,var(--fill-2),var(--fill),var(--fill-2)); border-radius:10px; }
  .table { width:100%; border-collapse:collapse; font-size:13px; } .table th, .table td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .doc { padding:20px; max-width:1180px; width:100%; }
  .doc h1 { margin:0 0 8px; font-size:22px; } .doc h2 { font-size:16px; margin:24px 0 8px; }
  .doc p, .doc li { color:var(--ink-2); }
  .doc .table { display:block; overflow-x:auto; }
  .doc code { word-break:break-word; }
  .bottom { display:none; }
  .device.mobile .side, .device.mobile .rail, .device.mobile .desk { display:none !important; }
  .device:not(.mobile) .mob { display:none !important; }
  .device.mobile .bottom { display:flex; border-top:1px solid var(--line); min-height:60px; background:var(--bg); flex:none; }
  .bottom a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--ink-3); } .bottom a.on { color:var(--ink); font-weight:700; }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.38); display:flex; align-items:flex-end; z-index:5; }
  .sheet { background:var(--bg); width:100%; border-radius:18px 18px 0 0; padding:8px 16px 20px; max-height:90%; overflow:auto; }
  .sheet .grab { width:40px; height:4px; border-radius:4px; background:var(--fill-2); margin:4px auto 12px; }
  .sheet h2 { margin:0 0 4px; font-size:18px; }
  .device:not(.mobile) .scrim:not(.left):not(.right) { align-items:center; justify-content:center; }
  .device:not(.mobile) .scrim:not(.left):not(.right) .sheet { width:520px; border-radius:18px; }
  .scrim.left { align-items:stretch; justify-content:flex-start; } .scrim.right { align-items:stretch; justify-content:flex-end; }
  .panel { background:var(--bg); width:86%; max-width:340px; height:100%; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:2px; }
  .toast { position:absolute; left:16px; right:16px; bottom:76px; background:var(--ink); color:#fff; border-radius:12px; padding:12px 14px; font-size:13px; display:flex; gap:10px; align-items:center; z-index:6; }
  .device:not(.mobile) .toast { left:auto; right:20px; top:70px; bottom:auto; width:340px; }
  .n { display:none; }
  body.notes .n { display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:#e0b400; color:#111; font:700 11px/1 system-ui; margin-left:6px; vertical-align:middle; }
  .notes-panel { display:none; } body.notes .notes-panel { display:block; max-width:1280px; margin:0 auto; padding:0 16px 48px; }
  .notes-panel ol { background:#fff7d6; border:1px solid #e6cf6a; border-radius:8px; padding:16px 16px 16px 40px; margin:0; font-size:13px; }
  .pos-wrap { display:flex; flex:1; min-height:0; }
  .pos-cat { display:flex; flex-direction:column; flex:1; min-width:0; }
  .pos-cart { width:340px; flex:none; border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .device.mobile .pos-cart { display:none; }
  .cart-bar { display:none; }
  .device.mobile .cart-bar { display:flex; margin:0; border-radius:0; }
  .prod-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:10px 12px; }
  .device.mobile .prod-grid { grid-template-columns:repeat(2,1fr); }
  .pcard { border:1px solid var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:4px; min-height:44px; }
  .pcard b { font-size:13px; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .keypad span { min-height:52px; border:1px solid var(--line); border-radius:12px; display:grid; place-items:center; font-size:18px; font-weight:600; }
</style>
</head>
<body class="notes">
<div class="proto-bar">
  <strong>Rentify UX redesign · wireframe v1</strong>
  <label>Screen <select id="screen"></select></label>
  <button id="mob" aria-pressed="true">Mobile</button><button id="desk" aria-pressed="false">Desktop / Tablet</button><button id="notes" aria-pressed="true">Notes</button>
  <span style="flex:1"></span><span>Grayscale structure only · gray bars are placeholders · dashed "Needs backend" = API work first</span>
</div>
<div class="stage"><div class="device mobile" id="device"></div></div>
<div class="notes-panel" id="notesPanel"></div>
<script>
/* ---------- shared helpers ---------- */
const STORE = "Mekong Brew";
const n = (k) => `<span class="n" title="See note ${k}">${k}</span>`;
const ph = (cls = "") => `<span class="ph ${cls}"></span>`;
const need = (what) => `<span class="need">Needs backend: ${what}</span>`;
const field = (label, value = "", hint = "", area = false) => `<div class="field"><label>${label}</label><div class="input${area ? " area" : ""}">${value}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
const chips = (items, on = 0) => `<div class="chips">${items.map((c, i) => `<span class="chip ${i === on ? "on" : ""}">${c}</span>`).join("")}</div>`;
const tabs = (items, on = 0) => `<div class="tabs">${items.map((c, i) => `<span class="tab ${i === on ? "on" : ""}">${c}</span>`).join("")}</div>`;
// A row is a link. When it holds its own button, the title is the link instead (no nested links).
const row = (title, sub = "", end = "", href = "", lead = `<span class="thumb"></span>`) => {
  const ownAction = /<a\s/.test(end);
  const tag = href && !ownAction ? "a" : "div";
  const t = href && ownAction ? `<a class="t" href="#${href}">${title}</a>` : `<div class="t">${title}</div>`;
  return `<${tag} class="row" ${tag === "a" ? `href="#${href}"` : ""}>${lead}<div class="grow">${t}${sub ? `<div class="meta">${sub}</div>` : ""}</div>${end ? `<div class="end">${end}</div>` : ""}</${tag}>`;
};
const head = (title, sub = "", acts = "") => `<div class="page-head"><h1>${title}</h1>${acts ? `<div class="acts">${acts}</div>` : ""}${sub ? `<p>${sub}</p>` : ""}</div>`;
const skel = (h) => `<div class="skel" style="height:${h}px;margin:8px 16px"></div>`;

/* ---------- merchant shell ---------- */
// Places (menu): job-based, docs/experience 03 §4. Tools (header): same on phone and desktop.
const M_MENU = [
  [null, [["m_home", "Home"], ["m_orders", "Orders", "3"], ["m_products", "Products"], ["m_customers", "Customers"], ["m_reports", "Reports"], ["m_invoices", "Invoices"]]],
  ["Sales channels", [["m_marketplace", "Marketplace"], ["m_online", "Online store"], ["m_pos_open", "Point of sale"]]],
  ["More", [["m_returns", "Returns & problems", "1"], ["m_share", "Share your store"], ["m_settings", "Settings"], ["m_help", "Help"]]],
];
const M_BOTTOM = [["m_home", "Home"], ["m_orders", "Orders"], ["m_products", "Products"], ["m_pos_open", "POS"], ["m_share", "Share"]];
const M_SECTION = {
  m_home: "m_home", m_home_new: "m_home", m_states: "m_home", m_staff: "m_home", m_menu: "m_home", m_search: "m_home", m_notifications: "m_home",
  m_orders: "m_orders", m_order: "m_orders", m_order_action: "m_orders",
  m_returns: "m_returns", m_return: "m_returns",
  m_products: "m_products", m_product_form: "m_products", m_categories: "m_products",
  m_customers: "m_customers", m_customer: "m_customers", m_reports: "m_reports",
  m_invoices: "m_invoices", m_invoice_new: "m_invoices",
  m_marketplace: "m_marketplace", m_online: "m_online", m_design: "m_online", m_pos_open: "m_pos_open",
  m_share: "m_share", m_settings: "m_settings", m_settings_page: "m_settings", m_staff_settings: "m_settings", m_billing: "m_settings", m_help: "m_help",
};
function mShell(active, inner, rail = "", overlay = "", opts = {}) {
  const sec = M_SECTION[active];
  const side = M_MENU.map(([h, items]) => `${h ? `<h6>${h}</h6>` : ""}${items.map(([k, l, badge]) =>
    `<a class="nav-item ${sec === k ? "on" : ""}" href="#${k}"><span class="ico"></span>${l}${badge ? `<span class="tag">${badge}</span>` : ""}</a>`).join("")}`).join("");
  const bottom = M_BOTTOM.map(([k, l]) => `<a href="#${k}" class="${sec === k ? "on" : ""}"><span class="ico"></span>${l}</a>`).join("");
  return `
  <header class="top">
    <a class="icon-btn mob" href="#m_menu" aria-label="Menu">☰</a>
    <a class="brand" href="#m_home"><span class="mark"></span><span class="desk">Rentify</span><small>${opts.title || STORE}</small></a>
    <a class="search desk" href="#m_search">Search orders, products, customers</a>
    <span class="spacer mob"></span>
    <a class="icon-btn mob" href="#m_search" aria-label="Search"><span class="ico"></span></a>
    <a class="icon-btn" href="#m_notifications" aria-label="Notifications"><span class="ico"></span><span class="badge">2</span></a>
    <a class="avatar" href="#m_menu" title="Account">DC</a>
  </header>
  ${opts.banner || ""}
  <div class="body">
    <nav class="side">${side}</nav>
    <main class="main">${inner}</main>
    ${rail ? `<aside class="rail">${rail}</aside>` : ""}
  </div>
  ${opts.noBottom ? "" : `<nav class="bottom">${bottom}</nav>`}
  ${overlay}`;
}

/* ---------- marketplace shell (buyer) ---------- */
const K_BOTTOM = [["k_home", "Home"], ["k_categories", "Categories"], ["k_orders", "Orders"], ["k_wishlist", "Saved"], ["k_account", "Account"]];
const K_SECTION = { k_home: "k_home", k_search: "k_categories", k_categories: "k_categories", k_product: "k_categories", k_store: "k_categories", k_stores: "k_categories",
  k_cart: "k_home", k_checkout: "k_home", k_placed: "k_orders", k_orders: "k_orders", k_order: "k_orders", k_report: "k_orders",
  k_wishlist: "k_wishlist", k_account: "k_account", k_signin: "k_account", k_help: "k_account", k_sell: "k_account" };
function kShell(active, inner, overlay = "", opts = {}) {
  const sec = K_SECTION[active];
  const bottom = K_BOTTOM.map(([k, l]) => `<a href="#${k}" class="${sec === k ? "on" : ""}"><span class="ico"></span>${l}</a>`).join("");
  return `
  <header class="top">
    <a class="brand" href="#k_home"><span class="mark"></span><span>Rentify Market</span></a>
    <a class="search" href="#k_search">Search products and stores</a>
    <a class="icon-btn" href="#k_cart" aria-label="Cart"><span class="ico"></span><span class="badge">2</span></a>
    <a class="btn sm desk" href="#k_orders">Orders</a>
    <a class="avatar desk" href="#k_account">EW</a>
  </header>
  ${opts.desktopNav === false ? "" : `<nav class="tabs desk"><a class="tab" href="#k_categories">Categories</a><a class="tab" href="#k_stores">Stores</a><a class="tab" href="#k_search">New arrivals</a><a class="tab" href="#k_help">Help</a><a class="tab" href="#k_sell">Sell on Rentify</a></nav>`}
  <div class="body"><main class="main">${inner}</main></div>
  ${opts.noBottom ? "" : `<nav class="bottom">${bottom}</nav>`}
  ${overlay}`;
}

/* ---------- POS shell ---------- */
function pShell(active, inner, opts = {}) {
  const link = (k, l) => `<a class="chip ${active === k ? "on" : ""}" href="#${k}">${l}</a>`;
  return `
  <header class="top">
    <span class="brand"><span class="mark"></span><small>${STORE} · Dara</small></span>
    <span class="spacer"></span>
    <span class="pill desk">Shift open · float $50.00</span>
    <a class="icon-btn" href="#p_lock" aria-label="Lock register"><span class="ico"></span></a>
  </header>
  ${opts.noNav ? "" : `<div class="chips" style="padding-top:8px">${link("p_sell", "Sell")}${link("p_tickets", "Held")}${link("p_returns", "Returns")}${link("p_register", "Cash drawer")}</div>`}
  ${inner}`;
}

/* ---------- sitemap ---------- */

  "Merchant dashboard": ["m_home", "m_home_new", "m_orders", "m_order", "m_order_action", "m_returns", "m_return", "m_products", "m_product_form", "m_categories", "m_customers", "m_customer", "m_reports", "m_invoices", "m_invoice_new", "m_marketplace", "m_online", "m_design", "m_pos_open", "m_share", "m_settings", "m_settings_page", "m_staff_settings", "m_billing", "m_help"],
  "Merchant overlays & states": ["m_menu", "m_search", "m_notifications", "m_staff", "m_states"],
  "Buyer marketplace": ["k_home", "k_search", "k_categories", "k_product", "k_store", "k_stores", "k_cart", "k_checkout", "k_placed", "k_orders", "k_order", "k_report", "k_wishlist", "k_account", "k_signin", "k_help", "k_sell"],
  "POS app": ["p_open", "p_sell", "p_pay", "p_done", "p_tickets", "p_returns", "p_register", "p_lock"],
};

/* ---------- runtime ---------- */
const sel = document.getElementById("screen"), device = document.getElementById("device"), panel = document.getElementById("notesPanel");
sel.innerHTML = Object.entries(GROUPS).map(([g, keys]) => `<optgroup label="${g}">${keys.map((k) => `<option value="${k}">${SCREENS[k].label}</option>`).join("")}</optgroup>`).join("");
function render() {
  const key = SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : "overview";
  const s = SCREENS[key]; sel.value = key; device.innerHTML = s.html();
  panel.innerHTML = s.notes.length ? `<ol>${s.notes.map((t) => `<li>${t}</li>`).join("")}</ol>` : "";
  window.scrollTo(0, 0);
}
const setMode = (m) => { device.classList.toggle("mobile", m); document.getElementById("mob").setAttribute("aria-pressed", m); document.getElementById("desk").setAttribute("aria-pressed", !m); };
sel.onchange = () => { location.hash = sel.value; };
document.getElementById("desk").onclick = () => setMode(false);
document.getElementById("mob").onclick = () => setMode(true);
document.getElementById("notes").onclick = (e) => e.currentTarget.setAttribute("aria-pressed", document.body.classList.toggle("notes"));
window.addEventListener("hashchange", render);
setMode(true);
render();
</script>
