        '500':
          $ref: '#/components/responses/ServerError'

  /api/notifications/events:
    post:
      tags: [Notifications]
      summary: Ingest an authenticated Commerce notification source event
      description: Accepts frozen Commerce event names; recipients are resolved from trusted event identifiers and Core Store relationships. Replays are deduplicated.
      operationId: ingestNotificationEvent
      security:
        - serviceTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSourceEvent' }
      responses:
        '202': { description: Event accepted and inbox records created }
        '200': { description: Event was already processed }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/notifications/inbox:
    get:
      tags: [Notifications]
      summary: List the authenticated subject's in-app notifications
      operationId: listNotificationInbox
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Inbox page and scope-bound cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/InboxNotification' } }
                  page:
                    type: object
                    properties:
                      limit: { type: integer }
                      hasMore: { type: boolean }
                      nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/notifications/inbox/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Set the current subject's notification read state
      operationId: setNotificationReadState
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200': { description: Updated notification }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification channel and locale preferences
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      responses:
        '200': { description: Preferences and mandatory-notice policy }
    put:
      tags: [Notifications]
      summary: Update the authenticated subject's notification preferences
      description: Mandatory in-app security, legal and transactional notifications cannot be disabled.
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locale: { type: string, enum: [en, km] }
                optionalEnabled: { type: boolean }
                emailEnabled: { type: boolean }
                telegramEnabled: { type: boolean }
      responses:
        '200': { description: Updated preferences }
        '400': { $ref: '#/components/responses/BadRequestError' }

  /api/notifications/inbox/{notificationId}/deliveries:
    get:
      tags: [Notifications]
      summary: Inspect delivery status for the current subject's notification
      operationId: listNotificationDeliveries
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
      responses:
        '200': { description: Delivery status without provider secrets }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notifications/inbox/{notificationId}/deliveries/{deliveryId}/retry:
    post:
      tags: [Notifications]
      summary: Retry a due retryable provider delivery
      description: Uses the stable provider idempotency key; successful deliveries are not sent again. Terminal failures can be retried manually.
      operationId: retryNotificationDelivery
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
        - { $ref: '#/components/parameters/NotificationDeliveryId' }
      responses:
        '200': { description: Current delivery status }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notifications/inbox/{notificationId}/deliveries/{deliveryId}/attempts:
    get:
      tags: [Notifications]
      summary: Inspect safe provider attempt history
      operationId: listNotificationDeliveryAttempts
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
        - { $ref: '#/components/parameters/NotificationDeliveryId' }
      responses:
        '200': { description: 'Attempt number, outcome, safe error code and timestamp' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/notifications/send:
    post:
      tags:
        - Notifications
      summary: Send merchant Telegram direct notification
      operationId: sendMerchantNotification
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - websiteId
                - message
              properties:
                websiteId:
                  type: string
                  format: uuid
                message:
                  type: string
                options:
                  type: object
      responses:
        '200':
          description: Message dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Merchant Telegram not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Merchant Telegram not configured

  /api/notifications/callback:
    post:
      tags:
        - Notifications
      summary: Handle Telegram callback queries
      operationId: handleMerchantCallback
      security:
        - serviceTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callbackQuery
              properties:
                callbackQuery:
                  type: object
      responses:
        '200':
          description: Callback processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/notifications/orders:
    post:
      tags:
        - Notifications
      summary: Format and dispatch order lifecycle notifications to merchant
      operationId: handleOrderNotification
      security:
        - serviceTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - order
                - websiteId
              properties:
                type:
                  type: string
                  enum: [ new_order, order_cancelled ]
                order:
                  type: object
                  properties:
                    id:
                      type: string
                payment:
                  type: object
                orderItems:
                  type: array
                  items:
                    type: object
                websiteId:
                  type: string
                  format: uuid
                initiator:
                  type: string
                  enum: [ customer, merchant ]
      responses:
        '200':
          description: Order notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/notifications/orders/{orderId}/process:
    post:
      tags:
        - Notifications
      summary: Process order notification actions (e.g. cancellation)
      operationId: processOrderNotification
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [ cancel, confirm ]
      responses:
        '200':
          description: Action processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportCaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JSON Web Token passed in Authorization: Bearer <token> header."
    userAccessTokenCookie:
      type: apiKey
      in: cookie
      name: userAccessToken
      description: Short-lived access token cookie (15 min) for merchant and admin users.
    userRefreshTokenCookie:
      type: apiKey
      in: cookie
      name: userRefreshToken
      description: Long-lived refresh token cookie (30 days) for session rotation.
    staffAccessTokenCookie:
      type: apiKey
      in: cookie
      name: staffAccessToken
      description: Short-lived access token cookie (15 min) for staff members.
    staffRefreshTokenCookie:
      type: apiKey
      in: cookie
      name: staffRefreshToken
      description: Long-lived refresh token cookie (30 days) for staff rotation.
    internalSecretHeader:
      type: apiKey
      in: header
      name: x-internal-secret
      description: Shared internal secret between Rentify Core and Commerce APIs.
    serviceTokenHeader:
      type: apiKey
      in: header
      name: x-rentify-service-token
      description: Shared service authentication token for webhook and notification relays.
    opsTokenHeader:
      type: apiKey
      in: header
      name: x-ops-token
      description: High-privilege operational token for platform telemetry and
        contract management.

  responses:
    SupportCaseMutationResult:
      description: Case mutation result and idempotency replay indicator
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/SupportCase' }
              replayed: { type: boolean }
    BadRequestError:
      description: Bad Request — validation error or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            validation:
              value:
                error: Store name, primary category, and a boolean marketplace setting are
                  required
            generic:
              value:
                message: All fields are required
    UnauthorizedError:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            noToken:
              value:
                error: "Unauthorized: No token provided"
            invalidSession:
              value:
                error: Session is no longer valid
    ForbiddenError:
      description: Forbidden — actor does not possess required role or permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            notOwner:
              value:
                error: You do not have access to this store
            adminRequired:
              value:
                error: Admin access required
    NotFoundError:
      description: Not Found — requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          examples:
            storeNotFound:
              value:
                message: Store not found
            websiteNotFound:
              value:
                error: Website not found
    ConflictError:
      description: Conflict — approval is stale, expired, used, or mismatched
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    ValidationError:
      description: Validation failed for the requested scoped operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    BadGatewayError:
      description: Bad Gateway — upstream media storage or provider network error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: The image could not be uploaded. Please try again.
    ServiceUnavailableError:
      description: Service Unavailable — downstream service or storage temporarily
        unconfigured
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Image storage is temporarily unavailable
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
          example:
            message: Internal server error

  schemas:
    NotificationSourceEvent:
      type: object
      required: [eventId, eventName, schemaVersion, aggregateType, aggregateId, aggregateVersion, occurredAt, producer, correlationId, storeId]
      properties:
        eventId: { type: string, format: uuid }
        eventName:
          type: string
          enum: [catalog.product.held.v1, catalog.product.rejected.v1, catalog.appeal.updated.v1, order.placed.v1, order.accepted.v1, delivery.out_for_delivery.v1, delivery.delivered.v1, delivery.failed.v1, return.requested.v1, return.updated.v1, refund.confirmed.v1]
        schemaVersion: { type: string, enum: ['1.0.0'] }
        aggregateType: { type: string }
        aggregateId: { type: string }
        aggregateVersion: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        producer: { type: string, enum: [ecommerce-server] }
        correlationId: { type: string }
        storeId: { type: string, format: uuid }
        data:
          type: object
          description: Commerce-authoritative buyer subject identifier, required for order, delivery, return and refund events; mutable business facts are discarded.
          properties:
            buyerSubjectId: { type: string }
    InboxNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventName: { type: string }
        schemaVersion: { type: string }
        storeId: { type: string, format: uuid, nullable: true }
        aggregateType: { type: string }
        aggregateId: { type: string }
        templateKey: { type: string }
        templateVersion: { type: integer }
        locale: { type: string, enum: [en, km] }
        title: { type: string }
        body: { type: string }
        mandatory: { type: boolean }
        correlationId: { type: string }
        sourceOccurredAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    SupportCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        caseNumber: { type: string }
        caseType: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [open, triaged, in_progress, waiting_on_requester, waiting_on_merchant, escalated, resolved, closed, reopened] }
        queueKey: { type: string, nullable: true }
        requesterSubjectId: { type: string, nullable: true }
        requesterKind: { type: string }
        storeId: { type: string, format: uuid, nullable: true }
        assigneeSubjectId: { type: string, format: uuid, nullable: true }
        sourceSystem: { type: string, nullable: true }
        sourceType: { type: string, nullable: true }
        sourceId: { type: string, nullable: true }
        summary: { type: string }
        descriptionClassification: { type: string, nullable: true }
        language: { type: string, nullable: true }
        policyVersion: { type: string, nullable: true }
        serviceDeadlineAt: { type: string, format: date-time, nullable: true }
        openedAt: { type: string, format: date-time }
        triagedAt: { type: string, format: date-time, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        resolutionCode: { type: string, nullable: true }
        resolutionSummary: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sla:
          type: object
          properties:
            automaticEnforcementEnabled: { type: boolean }
            breached: { type: boolean }
    SupportCaseCreate:
      type: object
      additionalProperties: false
      required: [caseType, priority, requesterKind, summary, reason]
      properties:
        caseType: { type: string, maxLength: 64 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        requesterKind: { type: string, maxLength: 32 }
        requesterSubjectId: { type: string, maxLength: 128 }
        storeId: { type: string, format: uuid }
        queueKey: { type: string, maxLength: 64 }
        sourceSystem: { type: string, maxLength: 32 }
        sourceType: { type: string, maxLength: 64 }
        sourceId: { type: string, maxLength: 128 }
        summary: { type: string, maxLength: 500 }
        descriptionClassification: { type: string, maxLength: 64 }
        language: { type: string, maxLength: 16 }
        reason: { type: string, maxLength: 500 }
        links:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [subjectType, subjectId]
            properties:
              subjectType: { type: string, enum: [tenant, store, user, buyer, product, order, return, payment, buyer_report, review, subscription, payment_attempt, approval_request] }
              subjectId: { type: string, maxLength: 128 }
              relationship: { type: string, maxLength: 32 }
    StoreEntitlements:
      type: object
      required:
        - version
        - storeId
        - tier
        - displayName
        - lifecycleState
        - mutationsAllowed
        - capabilities
      properties:
        version:
          type: integer
          example: 1
        storeId:
          type: string
          format: uuid
        tier:
          type: string
          example: starter
        displayName:
          type: string
          example: Starter
        lifecycleState:
          type: string
          enum: [active, trial, grace_period, suspended, cancelled]
          example: active
        isTrial:
          type: boolean
        isActive:
          type: boolean
        isGracePeriod:
          type: boolean
        isSuspended:
          type: boolean
        isCancelled:
          type: boolean
        mutationsAllowed:
          type: boolean
        capabilities:
          type: object
          properties:
            marketplaceListing:
              type: boolean
            website:
              type: boolean
            productLimit:
              type: integer
            staffLimit:
              type: integer
            pos:
              type: boolean
            invoices:
              type: boolean
            customDomainBrowse:
              type: boolean
            hostedCheckout:
              type: boolean
            historicalOrderRead:
              type: boolean
        quotas:
          type: object
        dates:
          type: object
        restrictionReason:
          type: string
          nullable: true

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - version
        - checks
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
            - degraded
          example: ready
        service:
          type: string
          example: rentify-server
        version:
          type: string
          example: 1.0.0
        checks:
          type: object
          required:
            - database
            - migrations
            - redis
            - workers
          properties:
            database:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: true
                latencyMs:
                  type: number
                  example: 1.25
                message:
                  type: string
                  example: Database connection failed
            migrations:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: true
                pendingCount:
                  type: integer
                  example: 0
                message:
                  type: string
                  example: Pending migrations not applied
            redis:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Redis unavailable (cache fallback active)
            workers:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: false
                message:
                  type: string
        timestamp:
          type: string
          format: date-time
          example: '2026-10-19T02:00:00.000Z'

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Field name or input key with validation issue
          example: email
        message:
          type: string
          description: Validation message describing the constraint
          example: Invalid email format

    StandardErrorDetail:
      type: object
      required:
        - code
        - message
        - fieldErrors
        - retryable
        - correlationId
      properties:
        code:
          type: string
          description: Machine-readable stable error code
          example: BAD_REQUEST
        message:
          type: string
          description: Safe human-readable error description
          example: Invalid input parameters
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retryable:
          type: boolean
          description: Indicates whether the request can be safely retried
          example: false
        correlationId:
          type: string
          description: Unique correlation identifier matching response header
          example: req-123e4567-e89b-12d3-a456-426614174000

    StandardError:
      type: object
      properties:
        error:
          oneOf:
            - $ref: '#/components/schemas/StandardErrorDetail'
            - type: string
              example: Unauthorized access
        message:
          type: string
          example: Resource not found
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        correlationId:
          type: string
          example: req-123e4567-e89b-12d3-a456-426614174000

    ErrorEnvelope:
      $ref: '#/components/schemas/StandardError'

    StandardSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Action completed successfully
        data:
          type: object
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 018d34b1-827c-74a9-a9c1-5827c9b83701
        name:
          type: string
          example: Sokha Chan
        email:
          type: string
          format: email
          example: sokha.chan@example.com
        phoneNumber:
          type: string
          example: "+85512345678"
        role:
          type: string
          enum: [ user, admin ]
          example: user
        isVerified:
          type: boolean
          example: true
        profileImage:
          type: string
          example: default.jpg
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserProfileWithWebsite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        profileImage:
          type: string
        role:
          type: string
        isVerified:
          type: boolean
        Website:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            domain:
              type: string
            subdomain:
              type: string
            status:
              type: string
            WebsiteTemplate:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string

    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 018d34b1-827c-74a9-a9c1-5827c9b83702
        merchantId:
          type: string
          format: uuid
          example: 018d34b1-827c-74a9-a9c1-5827c9b83701
        websiteId:
          type: string
          format: uuid
          example: 018d34b1-827c-74a9-a9c1-5827c9b83703
        email:
          type: string
          format: email
          example: vicheka@example.com
        phoneNumber:
          type: string
          example: "+85598765432"
        name:
          type: string
          example: Vicheka Keo
        permissions:
          type: array
          items:
            type: string
            enum:
