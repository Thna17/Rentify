    get:
      tags:
        - Admin Operations
      summary: Paginated resource listing for platform administrators
      description: |
        Supports paginated query, search, and filtering across:
        `stores`, `users`, `websites`, `templates`, `subscriptions`, `packages`, `plan-payments`, `seller-reviews`.
      operationId: listAdminResource
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                stores,
                users,
                websites,
                templates,
                subscriptions,
                packages,
                plan-payments,
                seller-reviews
              ]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: q
          in: query
          description: Search term across resource-specific text fields
          schema:
            type: string
        - name: status
          in: query
          description: Filter stores by marketplaceApprovalStatus
          schema:
