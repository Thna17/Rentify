openapi: 3.0.3
info:
  title: Rentify Core API
  version: 1.0.0
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC
  description: |
    Authoritative Core API contract for active Release 1 routes in `rentify-server`.

    This specification documents the current, code-backed behavior of `rentify-server` (Port 3001),
    governing identity, merchant and store ownership, storefront websites, templates, subscriptions,
    staff permissions, deployments, admin operations, and internal service communication.

    ### Release 1 Principles
    - **Rentify is the Backend Authority**: Core owns identity, store registration, website configuration, and subscriptions.
    - **Current Implemented Behavior Only**: Unimplemented methods and route discrepancies observed in code are explicitly marked.
    - **Safe Examples**: Zero production credentials, customer PII, or real tokens are included.
servers:
  - url: http://localhost:3001
    description: Local development Core API
  - url: https://api.rentifymarket.com
    description: Production Core API
tags:
  - name: System
    description: Service health and system probes
  - name: Auth
    description: Authentication, session management, OTP, and password recovery
  - name: Users
    description: User account profile and password management
  - name: Stores
    description: Merchant Store identity, seller application, and public store profiles
  - name: Websites
    description: Storefront website provisioning, content personalization, palettes,
      and themes
  - name: Templates
    description: Public storefront templates catalog
  - name: Deployments
    description: Website publishing, status polling, and hosted subdomain orchestration
  - name: Dashboard
    description: Merchant dashboard website and subscription context
  - name: Staff
    description: Merchant staff management, invitations, authentication, and permissions
  - name: Billing & Packages
    description: Subscription plans and merchant QR payment initiation
  - name: Admin Operations
    description: Platform administrator console, store reviews, and template management
  - name: Platform Ops
    description: Outcome contracts, invoice reminders, and automated recovery telemetry
  - name: Internal Service
    description: Synchronous service-to-service communication between Core and Commerce APIs
  - name: Notifications
    description: Merchant notification dispatch, order callbacks, and Telegram integration

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check probe
      description: Returns container and load-balancer status without exposing
        internal dependency states.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
      security: []

  /ready:
    get:
      tags:
        - System
      summary: Service readiness probe
      description: Evaluates connectivity to required dependencies (database, migrations, redis where required) and reports whether this instance can safely handle traffic.
      operationId: getReady
      responses:
        '200':
          description: Service is ready or safely degraded (can accept traffic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is not ready to serve traffic (dependency failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
      security: []

  /api/auth/session:
    get:
      tags:
        - Auth
      summary: Get active session profile
      description: |
        Retrieves the profile of the currently authenticated actor.
        Mounted identically on `/api/auth/session` and `/api/auth/me`.
      operationId: getSessionProfile
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
      responses:
        '200':
          description: Active session user or staff member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                merchantUser:
                  value:
                    user:
                      id: 018d34b1-827c-74a9-a9c1-5827c9b83701
                      name: Sokha Chan
                      email: sokha.chan@example.com
                      phoneNumber: "+85512345678"
                      role: user
                      isVerified: true
                staffMember:
                  value:
                    user:
                      id: 018d34b1-827c-74a9-a9c1-5827c9b83702
                      name: Vicheka Keo
                      email: vicheka@example.com
                      phoneNumber: "+85598765432"
                      role: staff
                      isVerified: true
                      websiteId: 018d34b1-827c-74a9-a9c1-5827c9b83703
                      merchantId: 018d34b1-827c-74a9-a9c1-5827c9b83701
                      permissions:
                        - manage_products
                        - manage_orders
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get active session profile (alias)
      description: Alias of `/api/auth/session`.
      operationId: getSessionProfileAlias
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
      responses:
        '200':
          description: Active session profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new merchant or buyer account
      description: |
        Creates a new user record. If returnUrl or returnDomain is supplied, it is validated
        against allowed Rentify origins to prevent open redirects.
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: Sokha Chan
              email: sokha.chan@example.com
              phoneNumber: "+85512345678"
              password: StrongPassword123!
              verificationMethod: email
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User and fallback staff login
      description: |
        Authenticates with email/phone and password. If no user is found with matching credentials,
        checks the Staff model and logs in as active staff. Sets `userAccessToken` (or `staffAccessToken`),
        `userRefreshToken` (or `staffRefreshToken`), and `authType` cookies.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: sokha.chan@example.com
              password: StrongPassword123!
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets access and refresh cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []

  /api/auth/mfa/challenge:
    post:
      tags:
        - Auth
      summary: Verify MFA challenge during login
      description: |
        Verifies a 6-digit TOTP code or single-use recovery code against an admin user's account
        following a successful password challenge that returned `mfaRequired: true`.
      operationId: authMfaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfaChallengeToken
              properties:
                mfaChallengeToken:
                  type: string
                  description: Short-lived challenge token issued during initial login
                mfaToken:
                  type: string
                  description: 6-digit TOTP code from authenticator app
                  example: "123456"
                recoveryCode:
                  type: string
                  description: Single-use recovery code
                  example: "ABCD-EFGH-JKMN"
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/BadRequestError'
      security: []

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out active user
      description: Revokes the stored refresh token hash and clears authentication cookies.
      operationId: authLogout
      security:
        - userRefreshTokenCookie: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
              example:
                success: true
                message: Logout successful
                data: null

  /api/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh authentication access token
      description: |
        Rotates the refresh token using the `userRefreshToken` cookie.
        Supports token rotation grace window to survive client request races.
      operationId: authRefreshToken
      security:
        - userRefreshTokenCookie: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token refreshed
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/validate-token:
    post:
      tags:
        - Auth
      summary: Validate access or refresh token
      operationId: authValidateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  entity:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      security: []

  /api/auth/verify-otp:
    post:
      tags:
        - Auth
      summary: Verify account via OTP
      operationId: authVerifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                otp:
                  type: string
                  example: "123456"
                returnUrl:
                  type: string
                returnDomain:
                  type: string
              required:
                - otp
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Verification successful
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      security: []

  /api/auth/resend-otp:
    post:
      tags:
        - Auth
      summary: Resend verification OTP
      operationId: authResendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                verificationMethod:
                  type: string
                  enum: [ email, sms, telegram ]
                returnDomain:
                  type: string
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP sent successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      security: []

  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset link or token
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
      responses:
        '200':
          description: Reset token sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reset token sent
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      security: []

  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password with token
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequestError'
      security: []

  /api/auth/telegram-login-config:
    get:
      tags:
        - Auth
      summary: Get Telegram login widget configuration
      operationId: authTelegramLoginConfig
      responses:
        '200':
          description: Telegram widget configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: true
                  botId:
                    type: string
                    nullable: true
                    example: "1234567890"
      security: []

  /api/auth/login/telegram:
    post:
      tags:
        - Auth
      summary: Authenticate via Telegram login widget
      operationId: authLoginTelegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authData
              properties:
                authData:
                  type: object
                  required:
                    - id
                    - hash
                    - auth_date
                  properties:
                    id:
                      type: integer
                    first_name:
                      type: string
                    username:
                      type: string
                    photo_url:
                      type: string
                    auth_date:
                      type: integer
                    hash:
                      type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
      security: []

  /api/auth/check-telegram-link:
    get:
      tags:
        - Auth
      summary: Check if a user's phone number is linked to Telegram
      operationId: authCheckTelegramLink
      parameters:
        - name: phoneNumber
          in: query
          required: true
          schema:
            type: string
          example: "+85512345678"
      responses:
        '200':
          description: Link status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLinked:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Telegram account is linked
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      security: []

  /api/user:
    get:
      tags:
        - Users
      summary: Get user profile with associated website and template
      operationId: getUserProfile
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileWithWebsite'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Users
      summary: Update user profile name and email
      operationId: updateUserProfile
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Sokha Chan
                email:
                  type: string
                  format: email
                  example: sokha.new@example.com
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Email is already in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email is already in use
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/user/change-password:
    post:
      tags:
        - Users
      summary: Change password for authenticated user
      operationId: changePassword
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  description: Must be at least 8 chars, contain an uppercase letter and a number.
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/stores/categories:
    get:
      tags:
        - Stores
      summary: Get list of official Store primary categories
      description: Returns the curated taxonomy of allowed primary store categories.
      operationId: getStoreCategories
      responses:
        '200':
          description: Store categories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - Fashion
                      - Beauty & Skincare
                      - Electronics
                      - Home & Living
                      - Food & Beverage
                      - Groceries
                      - Handmade Crafts
                      - Other
      security: []

  /api/stores/public:
    get:
      tags:
        - Stores
      summary: Batch lookup approved public stores
      description: Returns public store card details for up to 60 comma-separated
        approved store IDs.
      operationId: listPublicStores
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated store UUIDs (max 60)
          schema:
            type: string
          example: 018d34b1-827c-74a9-a9c1-5827c9b83701,018d34b1-827c-74a9-a9c1-5827c9b83702
      responses:
        '200':
          description: List of approved public store profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicStore'
        '400':
          $ref: '#/components/responses/BadRequestError'
      security: []

  /api/stores/public/{storeId}:
    get:
      tags:
        - Stores
      summary: Get single approved public store by ID
      operationId: getPublicStore
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public store profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PublicStore'
        '404':
          $ref: '#/components/responses/NotFoundError'
      security: []

  /api/stores/mine:
    get:
      tags:
        - Stores
      summary: Get own store profile
      description: |
        Returns the merchant owner's store profile, or the store associated with a permitted staff member.
        Enriched with linked website ID, domain, and deployment status.
      operationId: getOwnStore
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
      responses:
        '200':
          description: Merchant store details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OwnStore'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Stores
      summary: Update own store settings
      description: Updates primary category, marketplace preference, logo URL, or marketplace accent color.
      operationId: updateOwnStore
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryCategory:
                  type: string
                  example: Handmade Crafts
                marketplaceEnabled:
                  type: boolean
                  example: true
                marketplaceColor:
                  $ref: '#/components/schemas/MarketplaceColor'
                logoUrl:
                  type: string
                  format: uri
                  nullable: true
                  example: https://res.cloudinary.com/rentify/image/upload/v1/logo.png
      responses:
        '200':
          description: Store updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/stores/mine/launch-checklist:
    get:
      tags:
        - Stores
      summary: Get authoritative merchant launch checklist
      description: Composes Core identity, Store, Website and Commerce catalog facts into safe checklist statuses and reason codes. Version 2 (DEC-028) has no seller-application, return-policy or approval items; marketplace listing is automatic, so publication_marketplace reports what is still missing or an admin moderation outcome.
      operationId: getOwnStoreLaunchChecklist
      x-client-generation: false
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
      responses:
        '200':
          description: Merchant launch checklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [version, observedAt, stale, merchantPath, summary, channels, items]
                    properties:
                      version:
                        type: integer
                      observedAt:
                        type: string
                        format: date-time
                      stale:
                        type: boolean
                      staleReasonCode:
                        type: string
                        nullable: true
                      merchantPath:
                        type: string
                        enum: [marketplace, storefront]
                      summary:
                        type: object
                      channels:
                        type: object
                      items:
                        type: array
                        items:
                          type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/stores:
    post:
      tags:
        - Stores
      summary: Create a marketplace-only store
      description: |
        Creates a merchant Store without requiring a storefront website.
        If the owner already has a store, the existing store is returned idempotently.
      operationId: createMarketplaceStore
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - primaryCategory
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: Angkor Artisan Crafts
                primaryCategory:
                  type: string
                  example: Handmade Crafts
                marketplaceEnabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Store'
        '200':
          description: Store already exists (idempotent response)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
