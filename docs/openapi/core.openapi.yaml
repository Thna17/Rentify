    post:
      tags: [Admin Access]
      summary: Propose a high-risk platform action
      description: Requires the action-specific propose permission, recent authentication and an MFA-verified session.
      operationId: proposeAdminApproval
      security:
        - bearerAuth: []
        - userAccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, targetType, targetId, scopeType, reason, requestedChange]
              properties:
                action: { type: string, enum: [seller.store.suspend, seller.decision.reject, platform.role.change, platform.identity.change, platform.store.close] }
                targetType: { type: string }
                targetId: { type: string }
                scopeType: { type: string, enum: [platform, store, case, queue, finance] }
                scopeId: { type: string, nullable: true }
                reason: { type: string, maxLength: 500 }
                sourceCaseId: { type: string, format: uuid, nullable: true }
                requestedChange: { type: object, additionalProperties: true }
                beforeVersion: { type: integer, nullable: true }
                expiresInMinutes: { type: integer, minimum: 5, maximum: 60, default: 30 }
      responses:
        '201': { description: Immutable pending approval request }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

