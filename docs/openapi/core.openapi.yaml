  /api/payment/cutluy/webhook:
    post:
      tags:
        - Billing & Packages
      summary: Ingest signed CutLuy payment webhook event
      description: |
        Processes signed raw-body webhook notifications from CutLuy for subscription payment attempts.
        Verified using HMAC-SHA256 signature in X-CutLuy-Signature header with timestamp freshness tolerance.
        Does not enable buyer checkout; creates payment infrastructure for subscription payments.
      operationId: ingestCutLuyWebhook
      security: []
      parameters:
        - name: X-CutLuy-Signature
          in: header
          required: true
          description: Timestamp and HMAC-SHA256 signature (e.g. t=1729200000,v1=abcdef...)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                payment_id:
                  type: string
                reference_id:
                  type: string
                status:
                  type: string
                  enum: [pending, scanned, paid, expired, failed]
                amount:
                  type: string
                currency:
                  type: string
                  enum: [USD]
      responses:
        '200':
          description: Webhook acknowledged and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  duplicate:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/payment/payway/callback:
    post:
      tags:
        - Billing & Packages
      summary: Handle ABA PayWay transaction callback
      description: Ingests server-to-server transaction status callbacks from ABA PayWay.
      operationId: paywayCallback
      security: []
      requestBody:
        required: true
        content:
