                  example: 1.25
                message:
                  type: string
                  example: Database connection failed
            migrations:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: true
                pendingCount:
                  type: integer
                  example: 0
                message:
                  type: string
