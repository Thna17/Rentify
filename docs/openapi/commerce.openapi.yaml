              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Redis unavailable (pubsub fallback active)
            workers:
              type: object
              required:
                - status
                - required
              properties:
                status:
                  type: string
                  example: up
                required:
                  type: boolean
                  example: false
