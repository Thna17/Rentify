  /api/marketplace/checkout:
    post:
      tags:
        - Checkout & COD
      summary: Marketplace Cash on Delivery (COD) checkout
      description: |
        Executes atomic checkout for a specific store's marketplace cart under Cash On Delivery terms.

        - Enforces idempotency via the `Idempotency-Key` header (or body `idempotencyKey`), mapped to database column `checkoutKey`.
        - Takes row-level database locks (`SELECT ... FOR UPDATE`) on product stock and delivery policy.
        - Verifies that `expectedTotalAmount` matches computed `subtotal + deliveryFee` to protect against concurrent price changes.
        - Immediately deducts inventory stock and creates matching `Order`, `OrderItem`, and `Payment` (method: `COD`, status: `pending`) records in one ACID transaction.
        - Emits an asynchronous order notification to the store owner.
      security:
        - userAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key (8-64 alphanumeric characters, underscores, hyphens)
          schema:
            type: string
            pattern: ^[a-zA-Z0-9_-]{8,64}$
            example: chk_mkt_20261018_98765432
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - storeId
                - expectedTotalAmount
                - customerInfo
                - shippingInfo
              properties:
                storeId:
                  $ref: "#/components/schemas/UUID"
                expectedTotalAmount:
                  $ref: "#/components/schemas/Money"
                idempotencyKey:
                  type: string
                  description: Alternative to Idempotency-Key header
                  example: chk_mkt_20261018_98765432
                customerInfo:
                  type: object
                  required:
                    - name
                    - phone
                  properties:
                    name:
                      type: string
                      maxLength: 120
                      example: Jane Doe
                    phone:
                      type: string
                      maxLength: 40
                      example: "+85512345678"
                shippingInfo:
                  type: object
                  required:
                    - address
                  properties:
                    address:
                      type: string
                      maxLength: 500
                      example: House 12, Street 345, Boeung Keng Kang 1, Phnom Penh, Cambodia
            example:
              storeId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              expectedTotalAmount: "52.50"
              idempotencyKey: chk_mkt_20261018_98765432
              customerInfo:
                name: Jane Doe
                phone: "+85512345678"
              shippingInfo:
                address: House 12, Street 345, Boeung Keng Kang 1, Phnom Penh, Cambodia
      responses:
        "201":
          description: Order created successfully via COD
          content:
            application/json:
              schema:
                type: object
                required:
                  - order
                properties:
                  order:
                    $ref: "#/components/schemas/CODOrderView"
              example:
                order:
                  id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  orderNumber: ORD-20261018-7821
                  storeId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  websiteId: null
                  buyerId: c3d4e5f6-a7b8-9012-cdef-123456789012
                  status: pending
                  deliveryStatus: pending
                  salesChannel: marketplace
                  subtotal: "50.00"
                  deliveryFee: "2.50"
                  totalAmount: "52.50"
                  currency: USD
                  customerInfo:
                    name: Jane Doe
                    phone: "+85512345678"
                  shippingInfo:
                    address: House 12, Street 345, Boeung Keng Kang 1, Phnom Penh, Cambodia
                  items:
                    - productId: d4e5f6a7-b8c9-0123-def1-234567890123
                      name: Handmade Kampot Pepper Basket
                      quantity: 2
                      price: "25.00"
                      total: "50.00"
                      seller:
                        storeId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      category: handicrafts
                  payment:
                    method: COD
                    status: pending
                    amountDue: "52.50"
                    collectedAmount: "0.00"
                    refundedAmount: "0.00"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          description: Stock shortage, empty cart, price mismatch, or duplicate checkout key with mismatched parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: post_api_marketplace_checkout
  /api/storefront/{websiteId}/checkout:
    post:
      tags:
        - Checkout & COD
      summary: Storefront Cash on Delivery (COD) checkout
      description: |
        Executes atomic checkout on a merchant's hosted storefront under Cash On Delivery terms.
        Resolves underlying `storeId` from `websiteId`, applies storefront delivery policies, locks stock, and commits order.
      security:
