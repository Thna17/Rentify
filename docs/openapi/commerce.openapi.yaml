      properties:
        code:
          type: string
          example: SELLER_APPROVAL_PENDING
        message:
          type: string
          example: Marketplace seller approval is pending platform review.
        nextAction:
          type: string
          example: Complete seller verification checklist and await platform approval.
        blocking:
          type: boolean
          example: true
    ChannelEligibility:
      type: object
      required:
        - channel
        - eligible
        - purchasable
        - reasons
      properties:
        channel:
          type: string
          enum:
            - marketplace
            - storefront
            - pos
          example: marketplace
        eligible:
          type: boolean
          description: Whether the product is visible and browsable on this channel
          example: false
        purchasable:
          type: boolean
          description: Whether the product can be added to cart and purchased on this channel
          example: false
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityReason"
        primaryBlocker:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EligibilityReason"
    PublicationSummary:
      type: object
      required:
        - isPublishedOnAnyChannel
      properties:
        isPublishedOnAnyChannel:
          type: boolean
          example: true
        primaryBlocker:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EligibilityReason"
    PublicationExplanation:
      type: object
      required:
        - isPublished
        - channels
        - summary
      properties:
        productId:
          nullable: true
          type: string
          format: uuid
        storeId:
          nullable: true
          type: string
          format: uuid
        status:
          nullable: true
          type: string
          example: active
        moderationStatus:
          type: string
          enum:
            - approved
            - pending
            - flagged
            - rejected
          example: approved
        isPublished:
          type: boolean
          example: true
        channels:
          type: object
          required:
            - marketplace
            - storefront
            - pos
          properties:
            marketplace:
              $ref: "#/components/schemas/ChannelEligibility"
            storefront:
              $ref: "#/components/schemas/ChannelEligibility"
            pos:
              $ref: "#/components/schemas/ChannelEligibility"
        summary:
          $ref: "#/components/schemas/PublicationSummary"
  responses:
    Error400:
      description: Bad request or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error401:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: Forbidden - unverified buyer, insufficient permissions, or suspended seller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error409:
      description: Business rule, version conflict, insufficient stock, or idempotency mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
