openapi: 3.0.3
info:
  title: Rentify Commerce API
  version: 1.0.0
  description: |
    Machine-readable OpenAPI 3.0.3 contract for active Release 1 routes in `ecommerce-server`.

    This specification represents the authoritative runtime contract for Rentify's commerce engine,
    spanning multi-channel catalog discovery, shopping carts, Cash On Delivery (COD) and Bakong KHQR checkout,
    order lifecycle management, point-of-sale (POS), invoice generation, store delivery policies, usage billing,
    and reconciliation-facing operational endpoints.

    ### Architectural and Tenancy Model
    - **Service Authority**: `ecommerce-server` is the authority for catalog, inventory, carts, checkout, orders, invoices, and payments.
    - **Stores and Channels**:
      - `storeId` uniquely identifies a merchant store.
      - `websiteId` is an optional storefront presentation channel linked to a store.
      - Sales channels include `marketplace` (central shared marketplace), `storefront` (merchant custom website), and `pos` (in-person point of sale).
    - **Money and Currency**:
      - All monetary amounts are formatted as two-decimal numeric strings (e.g., `"25.00"`).
      - Base currency for Release 1 is strictly `"USD"`.
      - Internal arithmetic operates in integer cents to prevent floating-point inaccuracies.
    - **Idempotency**:
      - Marketplace and storefront checkout endpoints enforce idempotency via the `Idempotency-Key` HTTP header (or body `idempotencyKey`), mapped to database column `checkoutKey` (UUID/string up to 64 characters).
      - Buyer order events (e.g., report/dispute submission) enforce idempotency using `eventKey`.

    ### Release 1 Implementation Findings & Discrepancies
    - **CutLuy Payment Behavior**: In accordance with Release 1 constraints, CutLuy provider integrations are unproven in this baseline contract and are not exposed. Release 1 payments support direct Bakong KHQR and Cash On Delivery (COD).
    - **Multi-Route Carts**: Both storefront (website-scoped `/api/cart/{websiteId}`) and central marketplace (`/api/marketplace/cart` and `/api/cart`) cart endpoints exist in the Express routing table. The central marketplace cart operates per `storeId`, whereas storefront carts resolve against the active website's underlying store.
    - **Store POS vs Website POS**: Point-of-Sale endpoints are mounted under both `/api/stores/{storeId}/orders/pos` and `/api/order/websites/{websiteId}/orders/pos`. Both routes utilize the shared `OrderController.createPOSOrder` and `POSOrdersStrategy`.
  license:
    name: Proprietary
    url: https://rentify.test/license
servers:
  - url: http://localhost:4000
    description: Local development commerce service
  - url: https://commerce.rentify.test
    description: CI and test environment gateway
tags:
  - name: Marketplace Catalog
    description: Public product discovery, category taxonomy, and reviews on the central marketplace
  - name: Store Catalog
    description: Merchant product and inventory management scoped to storeId
  - name: Storefront Products
    description: Website-scoped storefront product catalog, search, and variants
  - name: Categories
    description: Storefront category management
  - name: Marketplace Cart
    description: Multi-store marketplace shopping cart management
  - name: Storefront Cart
    description: Website-scoped shopping cart and quick-add actions
  - name: Checkout & COD
    description: Cash on Delivery (COD) checkout for marketplace and storefront channels
  - name: Buyer Orders
    description: Authenticated buyer order history, details, and issue reporting
  - name: Merchant Orders
    description: Merchant order processing, confirmation, and status transitions
  - name: Store Delivery
    description: Store delivery policies and flat fee configurations
  - name: Point of Sale (POS)
    description: Omnichannel in-person cash and digital payment order creation
  - name: Invoices
    description: Storefront and customer invoice generation and PDF exports
  - name: Payments
    description: Payment link generation, status inspection, and payment reconciliation
  - name: Payment Configuration
    description: Website-scoped payment gateway credentials and encryption
  - name: Customer Auth & Profile
    description: Storefront customer registration, OTP verification, and profiles
  - name: Store Access & Sync
    description: Core-to-Commerce tenant synchronization and access resolution
  - name: Platform Operations
    description: Central administration product, review, and report moderation
  - name: Operations Telemetry
    description: Fact reconciliation and invoice reminder triggers
  - name: Usage Billing
    description: Store view telemetry and usage aggregation billing
  - name: Ecommerce Statistics
    description: Analytical reports for merchants and platform administrators
  - name: Notifications
    description: Telegram order notification webhooks
  - name: Health
    description: Container and load balancer probe
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check probe
      description: Returns service liveness without disclosing sensitive dependencies or database status.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
      operationId: get_health
      security: []
  /ready:
    get:
      tags:
        - Health
      summary: Service readiness probe
      description: Evaluates connectivity to required dependencies (database, migrations, redis where required) and reports whether this instance can safely handle traffic.
      responses:
        "200":
          description: Service is ready or safely degraded (can accept traffic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service is not ready to serve traffic (dependency failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
      operationId: get_ready
      security: []
  /api/marketplace/categories:
    get:
      tags:
        - Marketplace Catalog
      summary: List central marketplace categories
      description: Returns the curated canonical taxonomy of product categories approved for marketplace listings.
      responses:
        "200":
          description: List of marketplace categories
          content:
            application/json:
              schema:
                type: object
                required:
                  - categories
                properties:
                  categories:
                    type: array
                    items:
                      type: string
                    example:
                      - handicrafts
                      - textiles
                      - jewelry
                      - art
                      - home-decor
                      - food-beverage
                      - fashion
                      - ceramics
      operationId: get_api_marketplace_categories
      security: []
  /api/marketplace/products:
    get:
      tags:
        - Marketplace Catalog
      summary: Search and browse marketplace products
      description: |
        Retrieves active, publicly visible marketplace products from approved pilot stores.
        Includes computed review ratings and Cloudinary image prioritization.
      parameters:
        - name: category
          in: query
          description: Filter by canonical marketplace category
          schema:
            type: string
            example: handicrafts
        - name: storeId
          in: query
          description: Filter products belonging to a specific store
          schema:
            $ref: "#/components/schemas/UUID"
        - name: search
          in: query
          description: Keyword search across product name
          schema:
            type: string
            example: silk
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page (max 60)
          schema:
            type: integer
            default: 20
            maximum: 60
      responses:
        "200":
          description: Paginated public products
          content:
            application/json:
              schema:
                type: object
                required:
                  - products
                  - total
                  - page
                  - limit
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProduct"
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        "400":
          $ref: "#/components/responses/Error400"
      operationId: get_api_marketplace_products
      security: []
  /api/marketplace/products/{productId}:
    get:
      tags:
        - Marketplace Catalog
      summary: Get marketplace product details
      description: Returns public product details, verified ratings, image URLs, and variant options for active marketplace products.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Public product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
        "404":
          $ref: "#/components/responses/Error404"
      operationId: get_api_marketplace_products_productId
      security: []
  /api/marketplace/products/{productId}/reviews:
    get:
      tags:
        - Marketplace Catalog
      summary: Get published reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Published reviews list
          content:
            application/json:
              schema:
                type: object
                required:
                  - reviews
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductReview"
      operationId: get_api_marketplace_products_productId_reviews
      security: []
    post:
      tags:
        - Marketplace Catalog
      summary: Submit a product review
      description: Submits a buyer rating and review for a purchased product. Requires authenticated verified buyer.
      security:
        - userAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
                - comment
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  maxLength: 2000
                  example: Excellent craftsmanship and rapid delivery!
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReview"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
      operationId: post_api_marketplace_products_productId_reviews
  /api/stores/{storeId}/products:
    get:
      tags:
        - Store Catalog
      summary: List merchant store products
      description: Returns all products belonging to the store with full inventory, status, and pricing fields.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
        - userRefreshTokenCookie: []
        - staffRefreshTokenCookie: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Store product list
          content:
            application/json:
              schema:
                type: object
                required:
                  - products
                  - total
                  - page
                  - limit
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  total:
                    type: integer
                    example: 15
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
      operationId: get_api_stores_storeId_products
    post:
      tags:
        - Store Catalog
      summary: Create a product in store
      description: Creates a product with inventory tracking, category classification, and optional marketplace visibility.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - marketplaceCategory
                - stockQuantity
              properties:
                name:
                  type: string
                  maxLength: 200
                  example: Hand-woven Silk Scarf
                description:
                  type: string
                  maxLength: 4000
                  example: 100% pure silk dyed with natural tree bark extracts.
                price:
                  $ref: "#/components/schemas/Money"
                marketplaceCategory:
                  type: string
                  example: textiles
                stockQuantity:
                  type: integer
                  minimum: 0
                  example: 25
                status:
                  type: string
                  enum:
                    - active
                    - draft
                  default: draft
                marketplaceVisibility:
                  type: boolean
                  nullable: true
                  example: true
                images:
                  type: array
                  items:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        format: uri
                        example: https://res.cloudinary.com/rentify/image/upload/v1/silk-scarf.jpg
                      alt:
                        type: string
                        maxLength: 240
                sku:
                  type: string
                  maxLength: 120
                  description: Required for a simple Product when variants are omitted.
                variants:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/ProductVariantInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "409":
          $ref: "#/components/responses/Error409"
      operationId: post_api_stores_storeId_products
  /api/stores/{storeId}/product-imports/template:
    get:
      tags: [Store Catalog]
      summary: Download the versioned product CSV template
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: Versioned UTF-8 CSV template, content: { text/csv: { schema: { type: string } } } }
        "403": { $ref: "#/components/responses/Error403" }
      operationId: get_api_stores_storeId_product_imports_template
  /api/stores/{storeId}/product-imports/export:
    get:
      tags: [Store Catalog]
      summary: Export authorized Store Product and SKU data
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: Formula-safe UTF-8 CSV export, content: { text/csv: { schema: { type: string } } } }
        "403": { $ref: "#/components/responses/Error403" }
      operationId: get_api_stores_storeId_product_imports_export
  /api/stores/{storeId}/product-imports:
    get:
      tags: [Store Catalog]
      summary: List recent product import jobs
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: Store-scoped import job history }
        "403": { $ref: "#/components/responses/Error403" }
      operationId: get_api_stores_storeId_product_imports
    post:
      tags: [Store Catalog]
      summary: Upload CSV and create an idempotent pre-import preview
      description: Parses and validates at most 5 MB or 5000 rows on the server. The Idempotency-Key and file hash identify a preview job; no Product is written until the job is started.
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Authoritative row preview and durable job }
        "400": { $ref: "#/components/responses/Error400" }
        "403": { $ref: "#/components/responses/Error403" }
        "409": { $ref: "#/components/responses/Error409" }
      operationId: post_api_stores_storeId_product_imports
  /api/stores/{storeId}/product-imports/{jobId}:
    get:
      tags: [Store Catalog]
      summary: Get Store-scoped import progress and result summary
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: jobId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: Import job with at most 100 preview rows }
        "404": { $ref: "#/components/responses/Error404" }
      operationId: get_api_stores_storeId_product_imports_jobId
  /api/stores/{storeId}/product-imports/{jobId}/start:
    post:
      tags: [Store Catalog]
      summary: Start or resume an import job
      description: Queues valid rows. Products are always created as marketplace-hidden drafts; invalid rows are never written.
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: jobId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "202": { description: "Job queued, resumed, or already completed" }
        "409": { $ref: "#/components/responses/Error409" }
      operationId: post_api_stores_storeId_product_imports_jobId_start
  /api/stores/{storeId}/product-imports/{jobId}/retry:
    post:
      tags: [Store Catalog]
      summary: Safely retry an interrupted import from its durable checkpoint
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: jobId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "202": { description: Job retry accepted or completed result replayed }
        "409": { $ref: "#/components/responses/Error409" }
      operationId: post_api_stores_storeId_product_imports_jobId_retry
  /api/stores/{storeId}/product-imports/{jobId}/report:
    get:
      tags: [Store Catalog]
      summary: Download a formula-safe correction report
      x-client-generation: false
      security: [{ userAccessTokenCookie: [] }, { staffAccessTokenCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: storeId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: jobId, in: path, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200": { description: CSV containing rejected rows and safe reason codes, content: { text/csv: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error404" }
      operationId: get_api_stores_storeId_product_imports_jobId_report
  /api/stores/{storeId}/products/evaluate-policy:
    post:
      tags:
        - Store Catalog
      summary: Pre-submission evaluation of product content against restricted taxonomy
      description: Returns real-time compliance feedback and guidance before product submission without mutating database state.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                marketplaceCategory:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Policy evaluation result and guidance
        "400":
          $ref: "#/components/responses/Error400"
      operationId: post_api_stores_storeId_products_evaluate_policy
  /api/stores/{storeId}/products/{productId}:
    get:
      tags:
        - Store Catalog
      summary: Get one merchant Store product and its SKUs
      description: Returns a Product only when it belongs to the authorized Store, including canonical SKU versions for safe editing.
      x-client-generation: false
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Store-owned Product and SKU snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
      operationId: get_api_stores_storeId_products_productId
    patch:
      tags:
        - Store Catalog
      summary: Update store product
      description: Updates product fields, pricing, inventory stock, or marketplace visibility. Requires optimistic lock `expectedVersion`.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  description: Current version of the product for optimistic locking
                  example: 1
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 4000
                price:
                  $ref: "#/components/schemas/Money"
                stockQuantity:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum:
                    - active
                    - draft
                    - archived
                    - out_of_stock
                marketplaceCategory:
                  type: string
                marketplaceVisibility:
                  type: boolean
                  nullable: true
                images:
                  type: array
                  items:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        format: uri
                      alt:
                        type: string
                        maxLength: 240
                replaceVariants:
                  type: boolean
                  description: When true, SKU rows omitted from variants are removed atomically.
                variants:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/ProductVariantInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          description: Conflict due to version mismatch or stock rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: patch_api_stores_storeId_products_productId
  /api/stores/{storeId}/products/{productId}/publication-status:
    get:
      tags:
        - Store Catalog
      summary: Get product publication eligibility and visibility explanation
      description: Returns centralized channel publication eligibility breakdown and safe reason codes with actionable next steps.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum:
              - marketplace
              - storefront
              - pos
              - all
      responses:
        "200":
          description: Publication eligibility explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationExplanation"
        "404":
          description: Product not found
      operationId: get_api_stores_storeId_products_productId_publication_status
  /api/stores/{storeId}/products/{productId}/appeal:
    post:
      tags:
        - Store Catalog
      summary: Submit a merchant appeal for a held or rejected product
      description: Merchants can submit explanation and safe HTTPS evidence URLs to appeal a moderation hold or rejection.
      security:
        - userAccessTokenCookie: []
        - staffAccessTokenCookie: []
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                evidenceUrls:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        "201":
          description: Appeal submitted successfully
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
