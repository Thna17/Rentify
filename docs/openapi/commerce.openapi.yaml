      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard JWT bearer authentication for API calls.
    customerAccessTokenCookie:
      type: apiKey
      in: cookie
      name: customerAccessToken
      description: HTTP-only session cookie for storefront customers.
    customerRefreshTokenCookie:
      type: apiKey
      in: cookie
      name: customerRefreshToken
      description: HTTP-only token refresh cookie for storefront customers.
    userAccessTokenCookie:
      type: apiKey
      in: cookie
      name: userAccessToken
      description: HTTP-only session cookie issued by Core API for merchants, platform admins, and verified marketplace buyers.
    userRefreshTokenCookie:
      type: apiKey
      in: cookie
      name: userRefreshToken
      description: HTTP-only refresh cookie for Core user sessions.
    staffAccessTokenCookie:
      type: apiKey
      in: cookie
      name: staffAccessToken
      description: HTTP-only session cookie for store staff actors.
    staffRefreshTokenCookie:
      type: apiKey
      in: cookie
      name: staffRefreshToken
      description: HTTP-only refresh cookie for store staff actors.
    sessionIdCookie:
      type: apiKey
      in: cookie
      name: sessionId
      description: Anonymous session identifier for guest cart sessions.
    serviceTokenHeader:
      type: apiKey
      in: header
      name: x-rentify-service-token
      description: Secret shared token for service-to-service calls from Core to Commerce.
    opsTokenHeader:
      type: apiKey
      in: header
      name: x-ops-token
      description: Shared operational secret for ops invoice reconciliation and telemetry.
  schemas:
    UUID:
      type: string
      format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Money:
      type: string
      pattern: ^\d+(\.\d{2})?$
      description: Monetary amount in USD formatted as a decimal string with two fractional places.
      example: "25.00"
    Currency:
      type: string
      enum:
        - USD
      default: USD
      description: Release 1 standard currency is USD.
      example: USD
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Field name or JSON path with invalid input
          example: quantity
        message:
          type: string
          description: Human-readable validation message for this field
          example: Quantity must be greater than zero
    StandardErrorDetail:
      type: object
      required:
        - code
        - message
        - fieldErrors
        - retryable
        - correlationId
      properties:
        code:
          type: string
          description: Machine-readable stable error code
          example: BAD_REQUEST
        message:
          type: string
          description: Safe human-readable error description
          example: Invalid input parameters
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        retryable:
          type: boolean
          description: Indicates whether the request can be safely retried
          example: false
        correlationId:
          type: string
          description: Unique correlation identifier matching response header
          example: req-123e4567-e89b-12d3-a456-426614174000
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          oneOf:
            - $ref: "#/components/schemas/StandardErrorDetail"
            - type: string
              description: Legacy human-readable error description
              example: Insufficient stock
        message:
          type: string
          description: Backward-compatible root error message
          example: Insufficient stock
        success:
          type: boolean
          description: Backward-compatible boolean success status
          example: false
        statusCode:
          type: integer
          description: Backward-compatible HTTP status code
          example: 409
        correlationId:
          type: string
          description: Backward-compatible root correlation identifier
          example: req-123e4567-e89b-12d3-a456-426614174000
    ErrorEnvelope:
      $ref: "#/components/schemas/ErrorResponse"
    Product:
      type: object
      required:
        - id
        - name
        - price
        - status
        - stockQuantity
        - version
      properties:
        id:
          $ref: "#/components/schemas/UUID"
