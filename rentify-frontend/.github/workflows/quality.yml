name: Quality
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RENTIFY_API_URL: https://api.rentify.test
      ECOMMERCE_API_URL: https://commerce.rentify.test
      AUTH_URL: https://auth.rentify.test
      MERCHANT_DASHBOARD_URL: https://merchant.rentify.test
      MARKETING_URL: https://www.rentify.test
      STOREFRONT_ORIGIN: https://store.rentify.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
