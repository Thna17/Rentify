<app-auth-layout
  variant="verify"
  eyebrow="Email verification"
  title="Enter your verification code"
  subtitle="Type the code we sent to your email to continue resetting your password."
>
  @if (success()) {
    <div class="notice success" role="status">
      Code verified. Now choose a new password.
    </div>
    <a class="primary-button button-link" routerLink="/reset-password">Continue to reset password</a>
  } @else {
    @if (error()) {
      <div class="notice error" role="alert">{{ error() }}</div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Verification code<span class="required">*</span></span>
        <span class="input-icon-wrap">
          <ui-icon name="key" [size]="16"></ui-icon>
          <input formControlName="code" placeholder="Enter the code" autocomplete="one-time-code" />
        </span>
        @if (form.controls.code.touched && form.controls.code.invalid) {
          <small>Enter the code you received by email.</small>
        }
      </label>
      <button class="primary-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Verifying…' : 'Verify code' }}
      </button>
    </form>
    <p class="auth-switch"><a routerLink="/forgot-password">← Back to request reset</a></p>
  }
</app-auth-layout>
