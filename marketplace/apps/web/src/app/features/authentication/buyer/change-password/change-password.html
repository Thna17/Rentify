<app-auth-layout
  variant="recover"
  eyebrow="Account security"
  title="Change your password"
  [subtitle]="'Signed in as ' + (user()?.email ?? 'buyer')"
>
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Current password</span>
      <div class="password-field">
        <input
          [type]="currentPasswordVisible() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
          placeholder="Enter your current password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleCurrentPassword()"
          [attr.aria-label]="currentPasswordVisible() ? 'Hide password' : 'Show password'"
          [attr.title]="currentPasswordVisible() ? 'Hide password' : 'Show password'"
        >
          <ui-icon [name]="currentPasswordVisible() ? 'eye' : 'eye-off'" [size]="18" />
        </button>
      </div>
    </label>
    <label>
      <span>New password</span>
      <div class="password-field">
        <input
          [type]="newPasswordVisible() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          placeholder="Create a new password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleNewPassword()"
          [attr.aria-label]="newPasswordVisible() ? 'Hide password' : 'Show password'"
          [attr.title]="newPasswordVisible() ? 'Hide password' : 'Show password'"
        >
          <ui-icon [name]="newPasswordVisible() ? 'eye' : 'eye-off'" [size]="18" />
        </button>
      </div>
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <small>Use 8+ characters with uppercase, lowercase and a number.</small>
      }
    </label>
    <label>
      <span>Confirm new password</span>
      <div class="password-field">
        <input
          [type]="confirmPasswordVisible() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Repeat your new password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleConfirmPassword()"
          [attr.aria-label]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
          [attr.title]="confirmPasswordVisible() ? 'Hide password' : 'Show password'"
        >
          <ui-icon [name]="confirmPasswordVisible() ? 'eye' : 'eye-off'" [size]="18" />
        </button>
      </div>
    </label>
    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Saving…' : 'Change password' }}
    </button>
    <button class="text-button" type="button" (click)="logout()">Sign out</button>
  </form>
</app-auth-layout>
